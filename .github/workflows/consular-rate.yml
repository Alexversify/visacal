name: consular-rate

on:
  schedule:
    # 평일 KST 08:30. 대사관 업무 시작 전에 그날 환율을 잡습니다.
    - cron: "30 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

# fee-watch 와 같은 그룹. 두 워크플로가 모두 docs/ 를 다시 만들므로 동시에 돌면 푸시가 충돌합니다.
concurrency:
  group: fee-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      # 실패해도 기록(last_error, failed_at)과 페이지 재생성, 커밋은 진행하고 마지막 단계에서 실패 처리합니다.
      # 스크린샷은 레포 밖 임시 폴더에만 만들고 실패 메일에 첨부합니다. 아티팩트로 올리지 않습니다.
      - name: 영사환율 수집
        id: collect
        continue-on-error: true
        env:
          AIS_EMAIL: ${{ secrets.AIS_EMAIL }}
          AIS_PASSWORD: ${{ secrets.AIS_PASSWORD }}
          AIS_PAYMENT_URL: ${{ secrets.AIS_PAYMENT_URL }}
          CONSULAR_MAIL_TO: ${{ secrets.CONSULAR_MAIL_TO }}
          NOTIFY_MODE: ${{ vars.NOTIFY_MODE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python -m src.consular_rate

      # GITHUB_TOKEN 푸시는 fee-watch 를 트리거하지 않으므로 여기서 직접 페이지를 다시 만듭니다.
      - name: 페이지 재생성
        env:
          RUN_MODE: render
        run: python -m src.main

      - name: 결과 커밋
        run: |
          git config user.name "consular-rate"
          git config user.email "actions@users.noreply.github.com"
          keep="$RUNNER_TEMP/consular-keep"
          mkdir -p "$keep"
          cp data/consular_rate.json data/consular_rate_history.csv "$keep"/ 2>/dev/null || true
          for attempt in 1 2 3; do
            git add data docs
            if git diff --staged --quiet; then
              echo "변경 없음"
              exit 0
            fi
            git commit -m "chore: 영사환율 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            if git push; then
              exit 0
            fi
            # 그 사이 main 이 바뀌었으면 최신 main 위에 영사환율 파일만 다시 얹고 페이지를 새로 만듭니다.
            echo "푸시 충돌, 최신 main 으로 다시 시도 ($attempt)"
            git fetch origin main
            git reset --hard origin/main
            cp "$keep"/* data/ 2>/dev/null || true
            RUN_MODE=render python -m src.main
          done
          echo "푸시 3회 실패"
          exit 1

      - name: 수집 실패 표시
        if: steps.collect.outcome == 'failure'
        run: |
          echo "영사환율 수집에 실패했습니다. 실패 메일과 data/consular_rate.json 의 last_error 를 확인하십시오."
          exit 1
