name: fee-watch

on:
  schedule:
    # KST 07:30, 19:30. USCIS는 미 동부 업무시간에 갱신되므로 저녁 실행이 실질 감시입니다.
    - cron: "30 22 * * *"
    - cron: "30 10 * * *"
    # 매시 5분: 예약 글 공개용 페이지 재생성
    - cron: "5 * * * *"
  workflow_dispatch:
  # 관리자 화면에서 글을 올리거나 설정을 바꾸면 바로 재빌드
  push:
    branches: [main]
    paths:
      - "content/**"
      - "config/**"
      - "src/**"
      - "data/scenarios.json"
      - "data/fees.json"
      - "docs/uploads/**"

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: fee-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_MODE: ${{ ((github.event_name == 'schedule' && github.event.schedule != '5 * * * *') || github.event_name == 'workflow_dispatch') && 'full' || 'render' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          if [ "$RUN_MODE" = "full" ]; then npm install -g @anthropic-ai/claude-code; fi
          if [ "$RUN_MODE" = "full" ]; then python -m playwright install --with-deps chromium; fi

      - name: 수집 및 분석
        env:
          # API 크레딧 먼저, 부족하면 Max 구독, 둘 다 소진되면 분석만 건너뜀 (src/llm.py)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_MAX_USD_PER_RUN: "0.5"
          # 월 API 상한(달러). 저장소 변수로만 올릴 수 있음. 비우면 src/llm.py 기본값
          LLM_MONTHLY_CAP_USD: ${{ vars.LLM_MONTHLY_CAP_USD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MAIL_TO_PROCESSING: ${{ secrets.MAIL_TO_PROCESSING }}
          MAIL_TO_SALES: ${{ secrets.MAIL_TO_SALES }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python -m src.main

      - name: 결과 커밋
        run: |
          git config user.name "fee-watch"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data docs
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 수수료 현황 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 이번 달 API 상한에 닿으면 소유자에게 이슈로 한 번 알립니다 (claude.yml 은 소유자 @claude 에만 반응하므로 실행되지 않음).
      - name: 월 API 상한 도달 알림
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(date -u +%Y-%m)
          f="data/llm_spend/$m/CAP_REACHED"
          [ -f "$f" ] || exit 0
          t="API 월 상한 도달 $m"
          n=$(gh issue list --state all --search "\"$t\" in:title" --json number --jq length)
          [ "$n" = "0" ] || exit 0
          gh issue create --title "$t" --body "@${{ github.repository_owner }} 이번 달 API 사용액이 상한에 닿았습니다 ($(cat "$f" | tr -d '\n') 달러). 이번 달 남은 기간은 API 과금 없이 Max 구독으로만 돕니다.

          더 쓰려면 승인이 필요합니다. 승인하실 때만 Settings → Secrets and variables → Actions → Variables 의 LLM_MONTHLY_CAP_USD 를 올려 주세요. 전체 사이트 합계 기준은 월 50달러입니다."
