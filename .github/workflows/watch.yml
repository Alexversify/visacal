name: fee-watch

on:
  schedule:
    # KST 07:30, 19:30. USCIS는 미 동부 업무시간에 갱신되므로 저녁 실행이 실질 감시입니다.
    - cron: "30 22 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: fee-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 수집 및 분석
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MAIL_TO_PROCESSING: ${{ secrets.MAIL_TO_PROCESSING }}
          MAIL_TO_SALES: ${{ secrets.MAIL_TO_SALES }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python -m src.main

      - name: 결과 커밋
        run: |
          git config user.name "fee-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 수수료 현황 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
